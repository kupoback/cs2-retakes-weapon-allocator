name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore plugin
        run: dotnet restore RetakesAllocator.csproj

      - name: Build plugin
        run: dotnet build RetakesAllocator.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/RetakesAllocator.Tests/RetakesAllocator.Tests.csproj -c Release

      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: build/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin build
        uses: actions/download-artifact@v4
        with:
          name: plugin-build
          path: build

      - name: Package plugin
        run: |
          cd build
          zip -r "../RetakesAllocator-${{ github.ref_name }}.zip" addons

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: RetakesAllocator ${{ github.ref_name }}
          files: RetakesAllocator-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ## RetakesAllocator ${{ github.ref_name }}

            A fork of [Ravid-A/cs2-retakes-weapon-allocator](https://github.com/Ravid-A/cs2-retakes-weapon-allocator)
            (based on upstream 3.2.6), the weapons allocator for
            [B3none's cs2-retakes](https://github.com/b3none/cs2-retakes), written in C# (.NET 10)
            for CounterStrikeSharp. With the new options left at their defaults it behaves
            exactly like upstream.

            ### Added in this fork
            - **Round types**: each round after the opening pistol rounds is rolled as a pistol,
              half-buy or full-buy round, using weights you set (`RoundTypes`, `HalfBuy`).
            - **Special rounds**: your own fixed-weapon rounds, e.g. deagle only or scouts only,
              each with its own chance, armour, grenades and taser (`RoundTypes.SpecialRounds`).
            - **Pistol round options**: armour, helmet and grenades on pistol rounds are now
              configurable (`PistolRound`).
            - **Taser**: every player gets a Zeus on every round except pistol rounds (`Taser`).
            - **AWP minimum team size**: no AWP for a team below a set size (`Awp.MinTeamSize`).
            - **Vote duration**: a passed vote can end after a set number of rounds
              (`Votes.RoundsPerVote`), and admins can end one with `css_resetvotes`.
            - The round announcement names the round type, e.g. "Retake deagle only round."
            - Fixed a crash when a saved weapon pointed past the end of a weapon list.

            ### Requirements
            - **CounterStrikeSharp** on .NET 10 (API **1.0.374** or newer) with Metamod:Source
            - **[MultiAddonManager](https://github.com/Source2ZE/MultiAddonManager)** and the
              [Retakes Allocator - HUD](https://steamcommunity.com/sharedfiles/filedetails/?id=3792297574)
              workshop addon (`3792297574`) for the loadout menu
            - **[B3none/cs2-retakes](https://github.com/b3none/cs2-retakes)** installed and running
            - A database: **MySQL/MariaDB** or **SQLite** (a local file, no server required)

            ### Installation
            1. Download `RetakesAllocator-${{ github.ref_name }}.zip` from the assets below.
            2. Extract it into your server's `game/csgo/` directory. The archive places the
               plugin at `addons/counterstrikesharp/plugins/RetakesAllocator/`.
            3. Restart the server (or run `css_plugins load RetakesAllocator`). On first load
               the config is generated automatically at
               `addons/counterstrikesharp/configs/plugins/RetakesAllocator/RetakesAllocator.json`.
            4. Fill in the `DbConnection` section (MySQL credentials, or set
               `"Provider": "sqlite"`), then reload the plugin.

            Already running an earlier build of this fork? Only `RetakesAllocator.dll` needs
            replacing, and an existing config keeps working. Add any new sections you want to
            use by hand.

            ### Configuration
            Everything lives in the single CounterStrikeSharp-managed config file above. See the
            [README](https://github.com/kupoback/cs2-retakes-weapon-allocator/blob/${{ github.ref_name }}/README.md)
            for every option and a full example config. Edits are applied live via
            CounterStrikeSharp's config hot reload, or on demand with `css_weapons_reload`
            (requires `@css/root`).

            ---

            ### What's changed
